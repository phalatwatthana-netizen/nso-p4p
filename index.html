    <style>
        :root {
            /* พาเลทสีแบรนด์ MOP (ฟ้าผสมเขียว) */
            --mop-blue-dark:#1E88E5; --mop-blue:#42A5F5; --mop-blue-light:#64B5F6;
            --mop-cyan:#26C6DA; --mop-teal:#00BFA5; --mop-green-light:#80E0B5;

        }

        /* ขนาดตัวอักษรให้เหมาะกับฟอนต์ไม่มีหัว (อ่านง่าย คมชัด) */
        .text-xs  { font-size: 0.78rem;  line-height: 1.05rem; }
        .text-sm  { font-size: 0.875rem; line-height: 1.3rem;  }
        .text-base{ font-size: 1rem;     line-height: 1.55rem; }
        .text-lg  { font-size: 1.125rem; line-height: 1.7rem;  }
        .text-xl  { font-size: 1.3rem;   line-height: 1.8rem;  }
        .text-2xl { font-size: 1.6rem;   line-height: 2rem;    }
        .text-3xl { font-size: 1.95rem;  line-height: 2.25rem; }
        h1,h2,h3 { letter-spacing: -0.01em; }

        /* ===== ยูทิลิตีไล่เฉดพรีเมียมแบรนด์ MOP ===== */
        .mop-gradient { background: linear-gradient(120deg, #1E88E5 0%, #26C6DA 45%, #00BFA5 75%, #80E0B5 100%); }
        .mop-gradient-soft { background: linear-gradient(120deg, #E7F2FD 0%, #E3F8FB 50%, #E7F8F1 100%); }
        .mop-text-gradient {
            background: linear-gradient(100deg, #1E88E5, #00BFA5 70%, #43A047);
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
        }
        /* เส้นขอบไล่เฉด (gradient border) สำหรับการ์ดพรีเมียม */
        .mop-card {
            position: relative; background: #ffffff; border-radius: 1.25rem;
            box-shadow: 0 10px 30px -10px rgba(0,137,123,0.18), 0 4px 10px -6px rgba(30,136,229,0.14);
            transition: transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s ease;
        }
        .mop-card::before {
            content:""; position:absolute; inset:0; border-radius:inherit; padding:1.5px;
            background: linear-gradient(135deg, rgba(30,136,229,.55), rgba(38,198,218,.45), rgba(0,191,165,.55));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor; mask-composite: exclude; pointer-events:none;
        }
        .mop-card:hover { transform: translateY(-6px); box-shadow: 0 24px 50px -16px rgba(0,137,123,0.35), 0 10px 24px -10px rgba(30,136,229,0.28); }
        .mop-card:hover .mop-card-ico { transform: scale(1.06) rotate(-3deg); }
        .mop-card-ico { transition: transform .35s cubic-bezier(.2,.8,.2,1); }

        /* แสงวาวบนปุ่ม/การ์ด (shine sweep) */
        .mop-shine { position: relative; overflow: hidden; }
        .mop-shine::after {
            content:""; position:absolute; top:0; left:-120%; width:60%; height:100%;
            background: linear-gradient(120deg, transparent, rgba(255,255,255,.35), transparent);
            transform: skewX(-20deg); transition: left .6s ease;
        }
        .mop-shine:hover::after { left:140%; }

        /* ปุ่มเมนูนำทางด้านซ้าย (sidebar nav) */
        .nav-item { transition: all .25s ease; border-radius: .9rem; }
        .nav-item:hover { transform: translateX(3px); }

        /* ซ่อน Scrollbar แต่ยังเลื่อนได้ */
        ::-webkit-scrollbar { width: 7px; height: 7px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: linear-gradient(#26C6DA,#00897B); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: linear-gradient(#1E88E5,#00766A); }

        .animate-float { animation: mopfloat 6s ease-in-out infinite; }
        @keyframes mopfloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    </style>

            const parseCSV = (str) => {
                const arr = []; let quote = false; let row = 0, col = 0;
                for (let c = 0; c < str.length; c++) {
                    let cc = str[c], nc = str[c+1];
                    arr[row] = arr[row] || []; arr[row][col] = arr[row][col] || '';
                    if (cc === '"' && quote && nc === '"') { arr[row][col] += cc; ++c; continue; }
                    if (cc === '"') { quote = !quote; continue; }
                    if (cc === ',' && !quote) { ++col; continue; }
                    if (cc === '\r' && nc === '\n' && !quote) { ++row; col = 0; ++c; continue; }
                    if (cc === '\n' && !quote) { ++row; col = 0; continue; }

                    arr[row][col] += cc;

                    const buf = await file.arrayBuffer();
                    const wb = XLSX.read(buf, { type: 'array' });

                    // แปลงเป็นลิสต์เซลล์เรียงลำดับ (row, col) พร้อมข้อความและตัวเลข
                    const cells = [];
                    rows.forEach((row, r) => (row || []).forEach((val, c) => {
                        cells.push({ r, c, text: String(val).trim(), num: toFloat(val) });
                    }));

                    const norm = (s) => String(s).replace(/\s+/g, '');

                    let col70 = -1, colYy = -1;
                    cells.forEach(x => {
                        const t = norm(x.text);
                        if (col70 === -1 && /70%/.test(t) && /เดือน/.test(t)) col70 = x.c;
                        if (colYy === -1 && /เดือน/.test(t) && !/70%/.test(t) && (/เยียวยา/.test(t) || /(^|[^0-9])1%/.test(t))) colYy = x.c;
                    });
                    const rowText = {};
                    cells.forEach(x => { rowText[x.r] = (rowText[x.r] || '') + ' ' + x.text; });
                    let targetR = -1;
                    Object.keys(rowText).forEach(r => {
                        const t = norm(rowText[r]);
                        if (targetR === -1 && /กลุ่มภารกิจ/.test(t) && /พยาบาล/.test(t) && /รวม/.test(t)) targetR = parseInt(r);
                    });
                    if (targetR !== -1 && (col70 !== -1 || colYy !== -1)) {
                        const t8 = col70 !== -1 ? cellNumAt(targetR, col70) : null;

                            setToastMessage(`✅ ดึงจากแถวกลุ่มภารกิจการพยาบาล · 8% ${(t8 || 0).toLocaleString('th-TH')} · 1% ${(t1 || 0).toLocaleString('th-TH')}`);
                            setTimeout(() => setToastMessage(''), 4000);
                            return;
                        }
                    }

                    const findNear = (idx) => {
                        const label = cells[idx];
                        const sameRowRight = cells.filter(x => x.r === label.r && x.c > label.c && x.num !== null).sort((a, b) => a.c - b.c)[0];
                        if (sameRowRight) return sameRowRight.num;
                        const sameColDown = cells.filter(x => x.c === label.c && x.r > label.r && x.num !== null).sort((a, b) => a.r - b.r)[0];
                        if (sameColDown) return sameColDown.num;
                        const after = cells.slice(idx + 1).find(x => x.num !== null);
                        return after ? after.num : null;

                    setToastMessage(`✅ ${action === 'delete_staff' ? 'ลบรายชื่อ' : 'ย้ายข้อมูล'} สำเร็จ`);
                    setTimeout(() => setToastMessage(''), 3000);
                } catch (error) {
                    setToastMessage('❌ เกิดข้อผิดพลาดในการอัปเดตชีต');
                    setTimeout(() => setToastMessage(''), 3000);
                } finally {
                    setIsUpdatingStaff(false);
                }
            };

            const recalcDepartments = (newList) => {
                const dCol = staffHeaders[5] || 'Column_F';
                const pCol = positionColName;
                
                setDepartments(prevDepts => {
                    return prevDepts.map(dept => {
                        const deptStaff = newList.filter(s => String(s[dCol] || '').trim() === String(dept.name).trim());
                        const summaryData = {};
                        staffHeaders.forEach(h => {
                            let total = 0;
                            deptStaff.forEach(staff => {
                                let val = staff[h];
                                if (val !== undefined && val !== null) {
                                    val = String(val).trim();
                                    if (val !== '' && val !== '0' && val !== '-') {
                                        const cleanedVal = val.replace(/,/g, '');
                                        if (!isNaN(cleanedVal) && cleanedVal !== '') total += Number(cleanedVal);
                                        else total += 1;
                                    }
                                }
                            });
                            summaryData[h] = total % 1 !== 0 ? Number(total.toFixed(2)) : total;
                        });
                        const positionCounts = {};
                        positionHeaders.forEach(pos => {
                            positionCounts[pos] = deptStaff.filter(s => String(s[pCol] || '').trim() === pos).length;
                        });
                        return { ...dept, staffCount: deptStaff.length, summaryData, positionCounts };
                    });
                });
            };

            const handleMoveStaffDept = (targetStaff, newDept) => {
                const dCol = staffHeaders[5] || 'Column_F';
                const idCol = staffHeaders[1] || 'รหัสเงินเดือน';
                const empId = targetStaff[idCol];

                setStaffDeptOverrides(prev => ({ ...prev, [targetStaff._id]: newDept }));
                const updatedStaffList = staffList.map(s => s._id === targetStaff._id ? { ...s, [dCol]: newDept } : s);
                setStaffList(updatedStaffList);
                recalcDepartments(updatedStaffList);

                if (debounceTimers.current[targetStaff._id]) {
                    clearTimeout(debounceTimers.current[targetStaff._id]);
                }
                debounceTimers.current[targetStaff._id] = setTimeout(() => {
                    updateStaffDataInSheet('update_dept', empId, newDept);
                }, 1200);
            };

            const triggerDelete = (staff) => {
                setConfirmModal({ isOpen: true, staff: staff });
            };

            const confirmDeleteStaff = () => {
                const targetStaff = confirmModal.staff;
                setConfirmModal({ isOpen: false, staff: null });
                if(!targetStaff) return;

                const idCol = staffHeaders[1] || 'รหัสเงินเดือน';
                const empId = targetStaff[idCol];

                const updatedStaffList = staffList.filter(s => s._id !== targetStaff._id);
                setStaffList(updatedStaffList);
                recalcDepartments(updatedStaffList);

                updateStaffDataInSheet('delete_staff', empId, null);
            };

            const onAddStaffFormSubmit = (e) => {
                e.preventDefault();
                setIsConfirmAddOpen(true);
            };

            const confirmAndAddStaff = async () => {
                setIsConfirmAddOpen(false);
                setIsUpdatingStaff(true);
                try {
                    const payload = {
                        action: 'add_staff',
                        newStaff: newStaffForm,
                        headers: staffHeaders
                    };
                    await fetch('https://script.google.com/macros/s/AKfycbyg8UHSO1S5FHxsyV-hvR1JebboGXiULx4fJGlF9b_n_1stlXOoecSDCDfJfcxWumto/exec', {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    const newEntry = { _id: Date.now(), ...newStaffForm };
                    const updatedList = [...staffList, newEntry];
                    setStaffList(updatedList);
                    recalcDepartments(updatedList);

                    setToastMessage('✅ เพิ่มรายชื่อใหม่ลงชีตเรียบร้อย');
                    setTimeout(() => setToastMessage(''), 3000);
                    setIsAddStaffModalOpen(false);
                    setNewStaffForm({});

                    setToastMessage('❌ เกิดข้อผิดพลาดในการเพิ่มข้อมูลลงชีต');
                    setTimeout(() => setToastMessage(''), 3000);
                } finally {
                    setIsUpdatingStaff(false);
                }
            };

            const handleAddDeptSubmit = async (e) => {
                e.preventDefault();
                const trimmedName = newDeptName.trim();
                if (!trimmedName) return;
                
                try {
                    // ปลดล็อกการลบ (เผื่อว่าเคยลบไปแล้วกลับมาแอดใหม่)
                    const savedDeletedDepts = JSON.parse(localStorage.getItem('nursingApp_deletedDepartments') || '[]');
                    if (savedDeletedDepts.includes(trimmedName)) {
                        const newDeleted = savedDeletedDepts.filter(name => name !== trimmedName);
                        setDeletedDepartments(newDeleted);
                        localStorage.setItem('nursingApp_deletedDepartments', JSON.stringify(newDeleted));
                    }

                    // Optimistic update Local State
                    setDepartments(prev => {
                        if (prev.find(d => d.name === trimmedName)) return prev;
                        return [...prev, { id: trimmedName, name: trimmedName, staffCount: 0, balance: 0, summaryData: {}, positionCounts: {} }];

                    // Save to LocalStorage
                    const savedCustomDepts = JSON.parse(localStorage.getItem('nursingApp_customDepartments') || '[]');

                        const newCustomDepts = [...savedCustomDepts, trimmedName];
                        setCustomDepartments(newCustomDepts);
                        localStorage.setItem('nursingApp_customDepartments', JSON.stringify(newCustomDepts));

                    // Background Sync API
                    const payload = {
                        action: 'add_department',
                        departmentName: trimmedName
                    };
                    fetch('https://script.google.com/macros/s/AKfycbyg8UHSO1S5FHxsyV-hvR1JebboGXiULx4fJGlF9b_n_1stlXOoecSDCDfJfcxWumto/exec', {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    }).then(() => {
                        // Optional: fetchStaffData();
                    });

                    setToastMessage('✅ เพิ่มหน่วยงานใหม่เรียบร้อย');
                    setTimeout(() => setToastMessage(''), 3000);
                    setIsAddDeptModalOpen(false);
                    setNewDeptName('');

                    setToastMessage('❌ เกิดข้อผิดพลาดในการบันทึกหน่วยงานลงชีต');
                    setTimeout(() => setToastMessage(''), 3000);
                }

            const executeDeleteDept = async () => {
                const dept = confirmDeleteDeptModal.dept;
                if (!dept) return;

                // 1. นำไปใส่ในรายชื่อที่ถูกลบ (ซ่อนถาวร)
                setDeletedDepartments(prev => {
                    const newDeleted = [...prev, dept.name];
                    localStorage.setItem('nursingApp_deletedDepartments', JSON.stringify(newDeleted));
                    return newDeleted;
                });

                // 2. เอาออกจาก Custom (ถ้ามี)
                setCustomDepartments(prev => {
                    const newCustom = prev.filter(name => name !== dept.name);

                    return newCustom;
                });

                // 3. เอาออกจากตารางที่หน้าเว็บทันที
                setDepartments(prev => prev.filter(d => d.name !== dept.name));

                try {
                    const payload = { action: 'delete_department', departmentName: dept.name };
                    fetch('https://script.google.com/macros/s/AKfycbyg8UHSO1S5FHxsyV-hvR1JebboGXiULx4fJGlF9b_n_1stlXOoecSDCDfJfcxWumto/exec', {
                        method: 'POST',
                        mode: 'no-cors',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                } catch (e) {}
            };

            const handleAddCriteriaSubmit = async (e) => {

                        headers: { 'Content-Type': 'application/json' },

                    fetchCriteriaData();

                    setToastMessage('❌ เกิดข้อผิดพลาดในการบันทึกข้อมูลลงชีต');
                    setTimeout(() => setToastMessage(''), 3000);
                } finally {
                    setIsUpdatingStaff(false);
                }

            const handleEditCriteria = (item) => {

                        headers: { 'Content-Type': 'application/json' },

                    setToastMessage(`✅ ลบเกณฑ์ ${item.group} เรียบร้อยแล้ว`);
                    setTimeout(() => setToastMessage(''), 3000);

                    // ดึงข้อมูลใหม่เพื่อซิงค์ตาราง
                    fetchCriteriaData();
                } catch (e) {
                    setToastMessage('❌ เกิดข้อผิดพลาดในการลบข้อมูล');
                    setTimeout(() => setToastMessage(''), 3000);
                } finally {
                    setIsUpdatingStaff(false);
                }
            };

            const summaryHeadersToDisplay = staffHeaders.filter((h, index) => {
                const colNum = index + 1;
                if (colNum >= 12 && colNum <= 25) return false;
                if (h === positionColName) return false;
                const hTrimmed = h.trim();
                if (hTrimmed === '') return false;
                const excludedExact = ['ลำดับ', 'รหัส', 'รหัสเงินเดือน', 'คำนำหน้า', 'ชื่อ', 'สกุล', 'ตำแหน่ง', 'หน่วย', 'หน่วยงาน'];
                if (excludedExact.includes(hTrimmed)) return false;
                if (hTrimmed.includes('ชื่อ') && hTrimmed.includes('สกุล')) return false; 
                return true;
            });

            const numBudget8 = parseFloat(budget8Percent) || 0;
            
            // --- FIX: เพิ่มการคำนวณสัดส่วน 8% ให้รองรับทั้งแบบกลุ่มตำแหน่ง และแบบคอลัมน์ 8% ใน Sheet ---
            const deptWeights = departments.map(dept => {
                let posWeight = 0;
                positionHeaders.forEach(pos => {
                    const count = dept.positionCounts?.[pos] || 0;
                    const propStr = proportionSettings[`pos-${pos}`] !== undefined ? proportionSettings[`pos-${pos}`] : (sheetDefaults.proportion[pos] || "");
                    const propVal = parseFloat(propStr) || 0;
                    posWeight += count * propVal;
                });

                // ดึงผลรวมจากคอลัมน์ที่ 8 (Index 7) โดยตรงเพื่อรองรับ Sheet เดิม
                const header8 = staffHeaders[7] || '8%';
                const col8Sum = dept.summaryData?.[header8] || 0;

                // หากมีการให้ค่าน้ำหนักรายตำแหน่งจะใช้ posWeight แต่ถ้าไม่มีจะใช้ผลรวมจากคอลัมน์ 8%
                const weight = posWeight > 0 ? posWeight : col8Sum;

                return { id: dept.id, name: dept.name, weight };
            });
            const grandTotalWeight = deptWeights.reduce((sum, d) => sum + d.weight, 0);

            const getWardTotalBudget = (dept) => {
                if (!dept) return 0;
                const dWeight = deptWeights.find(dw => dw.name === dept.name)?.weight || 0;
                const allocated8 = grandTotalWeight > 0 ? (dWeight / grandTotalWeight) * numBudget8 : 0;
                let allocated1 = 0;
                summaryHeadersToDisplay.forEach(header => {
                    const isExtra = header.includes('จัดสรรเพิ่มเติม');
                    const is1PercentCol = (header === staffHeaders[8] || header.includes('1%')) && !isExtra;
                    if (is1PercentCol) allocated1 += (dept.summaryData?.[header] || 0);
                });
                const adminExtra = adminExtraAllocations[dept.id] || 0;
                const manualAdj = transactions.filter(tx => tx.deptName === dept.name).reduce((sum, tx) => (tx.type === 'ADD' || tx.type === 'BONUS') ? sum + tx.amount : sum - tx.amount, 0);
                return allocated8 + allocated1 + adminExtra + manualAdj;
            };

            const totalAllocated = departments.reduce((sum, dept) => sum + getWardTotalBudget(dept), 0);
            const computed1Percent = departments.reduce((sum, dept) => {
                let val = 0;
                summaryHeadersToDisplay.forEach(header => { 
                    const isExtra = header.includes('จัดสรรเพิ่มเติม');
                    const is1PercentCol = (header === staffHeaders[8] || header.includes('1%')) && !isExtra;
                    if (is1PercentCol) val += (dept.summaryData?.[header] || 0); 
                });
                return sum + val;
            }, 0);
            const computed1PercentExtra = departments.reduce((sum, dept) => sum + (adminExtraAllocations[dept.id] || 0), 0);
            const totalGroupBudget = (parseFloat(budget8Percent) || 0) + computed1Percent + computed1PercentExtra;
            const remainingBudget = totalGroupBudget - totalAllocated;

            const formatCurrency = (amount) => new Intl.NumberFormat('th-TH', { style: 'currency', currency: 'THB' }).format(amount);
            
            const handleTransactionSubmit = (e) => {
                e.preventDefault();
                const amount = parseFloat(transactionForm.amount);
                if (isNaN(amount) || amount <= 0) return setErrorMsg('กรุณาระบุจำนวนเงินให้ถูกต้อง');
                if ((transactionForm.type === 'ADD' || transactionForm.type === 'BONUS') && amount > remainingBudget) return setErrorMsg('เงินกองกลางคงเหลือไม่เพียงพอ');

                if (transactionForm.type === 'DEDUCT' && amount > currentWardBudget) return setErrorMsg(`ไม่สามารถตัดเงินเกินยอดคงเหลือ (${formatCurrency(currentWardBudget)})`);
                
                const newTransaction = { id: Date.now(), date: new Date().toLocaleString('th-TH'), deptName: selectedDept.name, type: transactionForm.type, amount: amount, note: transactionForm.note || '-' };
                setTransactions([newTransaction, ...transactions]);
                setIsModalOpen(false);

                    await fetch('https://script.google.com/macros/s/AKfycbxcX8Gv5e52G_uNEC2YxBdaxfogkbPIuZgqrX83iPfdp4Lbt7_7_Vwofe491cbSgNg7/exec', { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
                    setToastMessage(`✅ บันทึกข้อมูลเรียบร้อยแล้ว`);

                    setTimeout(() => setToastMessage(''), 3000);
                } finally {
                    setIsSaving(false);
                }
            };

                        {departments.map((d, i) => <option key={i} value={d.name} />)}
                    </datalist>
                    <datalist id="position-options-list">
                        {positionHeaders.map((p, i) => <option key={i} value={p} />)}
                    </datalist>

                    {/* --- Toast Notification (Centered & Enlarge) --- */}

                            <span className="font-black text-2xl md:text-3xl flex items-center gap-3 tracking-wide drop-shadow-md">{toastMessage}</span>
                        </div>

                    {/* ================== เลย์เอาต์: เมนูบาร์ด้านซ้าย + เนื้อหา ================== */}

                            <div className="mop-card p-3 lg:p-4 flex lg:flex-col gap-2">
                                <div className="hidden lg:flex items-center gap-3 px-2 pb-3 mb-1 border-b border-teal-100/70">

                                    </p>
                                    <div className="flex gap-3">
                                        <button onClick={() => setConfirmDeleteCriteriaModal({ isOpen: false, item: null })} className="flex-1 py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition-colors">ยกเลิก</button>
                                        <button onClick={executeDeleteCriteria} className="flex-1 py-2.5 px-4 bg-rose-600 hover:bg-rose-700 text-white rounded-xl font-bold shadow-md hover:shadow-lg transition-colors">
                                            {isUpdatingStaff ? <RefreshCw size={16} className="animate-spin inline" /> : 'ยืนยันการลบ'}
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* --- NEW: Reusable Custom Prompt Input Modal for typing own options --- */}
                    {customPromptModal.isOpen && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-[70] p-4 animate-in fade-in duration-200">
                            <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden border border-teal-500/20">
                                <div className="p-5 flex justify-between items-center bg-teal-600 text-white">
                                    <h3 className="text-xl font-bold flex items-center gap-2">
                                        <PlusCircle size={20} className="text-teal-100" /> {customPromptModal.title}
                                    </h3>
                                    <button onClick={() => setCustomPromptModal(p => ({ ...p, isOpen: false }))} className="text-teal-100 hover:text-white bg-teal-700/50 hover:bg-rose-500 p-1.5 rounded-full transition-colors">
                                        <X size={16} />
                                    </button>
                                </div>
                                <div className="p-6">
                                    <input 
                                        type="text" 
                                        value={customPromptModal.value} 
                                        onChange={(e) => setCustomPromptModal(p => ({ ...p, value: e.target.value }))}
                                        placeholder={customPromptModal.placeholder}
                                        className="w-full px-4 py-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-teal-500 outline-none transition-all text-sm font-bold shadow-inner" 
                                        autoFocus
                                    />
                                    <div className="flex gap-3 mt-6">
                                        <button type="button" onClick={() => setCustomPromptModal(p => ({ ...p, isOpen: false }))} className="flex-1 py-2.5 px-4 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl font-bold transition-colors">ยกเลิก</button>
                                        <button type="button" onClick={() => {
                                            if (customPromptModal.value.trim()) {
                                                customPromptModal.callback(customPromptModal.value.trim());
                                            }
                                            setCustomPromptModal(p => ({ ...p, isOpen: false }));
                                        }} className="flex-1 py-2.5 px-4 bg-teal-600 hover:bg-teal-700 text-white rounded-xl font-bold shadow-md hover:shadow-lg transition-colors">ตกลง</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
